# Render Blueprint for PaperBull (Traders_app)
# Deploy: Render Dashboard -> New -> Blueprint -> connect ChetanSawale/Traders_app
# Secrets (JWT_SECRET, COOKIE_SECRET) are generated by Render on first deploy —
# they are NOT in this file and NOT copied from docker-compose.yml.
# Redis is intentionally not provisioned here: the backend falls back to its
# in-memory cache when REDIS_URL is unset (single-instance, fine for now).
# AWS later: replace this file with ECS/RDS/ElastiCache, keep the same env names.
services:
  - type: web
    name: trader-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trader-postgres
          property: connectionString

  - type: web
    name: trader-frontend
    env: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    healthCheckPath: /
    envVars:
      # Render private-network address of the backend service.
      # Backend listens on Render's $PORT (10000) via process.env.PORT.
      - key: BACKEND_HOST
        value: trader-backend
      - key: BACKEND_PORT
        value: "10000"
      - key: BACKEND_RESOLVER
        value: 169.254.169.254

databases:
  - name: trader-postgres
    plan: free
    databaseName: tradesphere
    user: tradesphere
