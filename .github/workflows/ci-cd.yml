name: TradeSphere CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # 1. INTEGRATION JOB: Type checking and builds verification
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # A. Backend Verification
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

      # B. Frontend Verification
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Compile Frontend Assets
        run: |
          cd frontend
          npm run build

# NOTE: Deployment is via the Render Blueprint (render.yaml) at the repo root,
# not via this workflow. The old DigitalOcean SSH deploy job was removed on
# 2026-10-27 because it failed on every push since the initial commit and
# is no longer the deploy target (Render is, AWS later).
